[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-lab"
version = "0.1.0"
description = "Modular implementations of algorithms and building blocks behind modern transformer models."
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "matplotlib",
    "pyyaml",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
